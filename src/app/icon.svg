<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="JW monogram">
  <title>Januda Withanage</title>
  <defs>
    <!-- Sapphire sheen, mirroring the glass surfaces used across the site. -->
    <radialGradient id="sheen" cx="28%" cy="18%" r="85%">
      <stop offset="0%" stop-color="#3651cf" stop-opacity=".55"/>
      <stop offset="60%" stop-color="#3651cf" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#0e1424" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ink disc, the same shape and colour as the navbar brand mark. -->
  <circle cx="16" cy="16" r="16" fill="#0e1424"/>
  <circle cx="16" cy="16" r="16" fill="url(#sheen)"/>

  <!-- JW monogram in the site's base cream. -->
  <g fill="none" stroke="#F6F5F1" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11.6 8.6v8.3c0 2.9-2.3 4.3-4.8 3.2"/>
    <path d="M14.4 8.6 16.7 20.9 19 14.8l2.3 6.1L23.6 8.6"/>
  </g>

  <!-- Champagne period, the accent the brand mark ends on. -->
  <circle cx="27" cy="19.6" r="1.8" fill="#b8955a"/>
</svg>
