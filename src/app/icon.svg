<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Deep navy glass mark -->
  <rect width="32" height="32" rx="7" fill="#080D19"/>

  <!-- Subtle cyan reflection -->
  <radialGradient id="glow" cx="50%" cy="50%" r="60%">
    <stop offset="0%" stop-color="#78CFFE" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#080D19" stop-opacity="0"/>
  </radialGradient>
  <rect width="32" height="32" rx="7" fill="url(#glow)"/>

  <!-- Left angle bracket < -->
  <path d="M7 16 L12 10.5" stroke="#78CFFE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M7 16 L12 21.5" stroke="#78CFFE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right angle bracket > -->
  <path d="M25 16 L20 10.5" stroke="#78CFFE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M25 16 L20 21.5" stroke="#78CFFE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Slash / in gold -->
  <path d="M19 9.5 L13 22.5" stroke="#D9B77A" stroke-width="2.2" stroke-linecap="round"/>
</svg>
